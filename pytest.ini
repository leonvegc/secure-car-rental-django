[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
testpaths = tests
python_files = test_*.py
# UTN-10: un solo comando (`pytest`) genera el reporte HTML y XML automáticamente.
addopts = -v --html=reportes/reporte-seguridad.html --self-contained-html --junitxml=reportes/junit.xml
filterwarnings =
    ignore:No directory at:UserWarning
markers =
    sqli: SQL Injection (UTN-07a)
    xss: Cross-Site Scripting (UTN-07b)
    sesion: Sesión segura (UTN-07c)
    csrf: CSRF (UTN-07d)
    acceso: Control de acceso / 403 (UTN-05, UTN-06)
    encabezados: Encabezados HTTP (UTN-08)
    auditoria: Registro de auditoría (UTN-09)
    credenciales: Contraseñas (UTN-02)
    negocio: Reglas de negocio del dominio (RFD / RN)
