{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h2>{{ titulo }}</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit">Guardar</button>
  <a href="{% url 'clientes:lista' %}" role="button" class="secondary outline">Cancelar</a>
</form>
{% endblock %}
