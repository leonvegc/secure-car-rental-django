{% extends "base.html" %}
{% block titulo %}Borrar vehículo{% endblock %}
{% block contenido %}
<h2>Borrar vehículo</h2>
<article>
  <p>
    ¿Desea borrar el vehículo <strong>{{ vehiculo.placa }}</strong>
    ({{ vehiculo.marca }} {{ vehiculo.modelo }})? Esta acción no se puede deshacer.
  </p>
</article>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="contrast">Sí, borrar</button>
  <a href="{% url 'vehiculos:detalle' vehiculo.pk %}" role="button" class="secondary outline">Cancelar</a>
</form>
{% endblock %}
