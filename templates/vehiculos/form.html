{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h2>{{ titulo }}</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit">Guardar</button>
  <a href="{% if form.instance.pk %}{% url 'vehiculos:detalle' form.instance.pk %}{% else %}{% url 'vehiculos:lista' %}{% endif %}" role="button" class="secondary outline">Cancelar</a>
</form>
{% endblock %}
